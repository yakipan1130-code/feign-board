vwRmPlOdILscCvD2pIpYBKHFEGA4rII4tSlDsdCCeqljWlCYiVq40Ucq58V14YSWJBEtyJu+vVECAByabmL7E/sdobVuxTA2rlT6WgUZ2zG5NWHp44++AEMTEHJ4yAvyvlOyh+HFSCAQMDkEyBsSagSQ2ecZFuiOBUoXotMTpdwzyS2EajiiSyED2TZ17PNWyAvRRx17VgzJss5kR+dCK0CA8YrxIRPqw0yUR3mh5bFgU0InK8Xw9v8HLN7/jQZ+t7IAAAAASUVORK5CYII=" alt="フェイン"> FEIGN 盤面メモ v10</h1><div class="actions"><button id="export">データ保存</button><button id="import">読み込み</button><button id="reset" class="danger">新しい盤面</button><button id="resetAll" class="danger" title="名前と色も含めて消去">全初期化</button></div></header><main><p class="hint">カードをドラッグして並べ替え。カードをクリックして名前・CO・その日の行き先と結果をまとめて編集。自動保存されます。</p><div class="globalday"><strong>全員共通の日付</strong><button id="prevDay">◀</button><select id="globalDay"></select><button id="nextDay">▶ 次の日</button><span class="hint">この日付で各カードの「＋ 記録」を編集</span></div><div id="board" class="board"></div><section id="quickPanel" class="quickpanel"><div class="quickhead"><h2 id="quickTitle">日ごとの記録</h2><button id="quickClose">閉じる ×</button></div><div class="daybar"><strong id="quickDayLabel">1日目</strong></div><div class="picklabel">行き先（色を選択・マウスを重ねると名前）</div><div id="quickTargets" class="targetgrid"></div><div class="picklabel">結果</div><div id="quickResults" class="resultbuttons"><button data-result="●">●</button><button data-result="×">×</button><button data-result="">○</button></div></section><section id="panel" class="panel"><h2 id="editTitle">プレイヤー編集</h2><div class="fields"><label class="field">名前<input id="name" maxlength="60"></label><label class="field">色<div class="colorline"><input id="color" type="color"><span id="colorCode"></span></div></label><label class="field">役職・CO<select id="role"><option value="">未CO・未確認</option><option>ドクター</option><option>バカ</option><option>クリーナー</option><option>プレイマー</option><option>ポリス</option><option>ルックアウト</option><option>インベスティゲーター</option><option>トラッパー</option><option>インポスター</option><option>ニュートラル</option><option>ドクターCO</option><option>バカCO</option><option>ポリスCO</option><option>ルックアウトCO</option><option>インベスティゲーターCO</option><option>トラッパーCO</option><option value="custom">その他（自由入力）</option></select><input id="roleCustom" placeholder="役職・COを自由入力" style="display:none;margin-top:4px"></label><label class="field">状態<select id="status"><option>生存</option><option>吊</option><option>襲撃</option></select></label></div><div class="inline-record"><strong id="inlineDay">1日目の記録</strong><span class="picklabel">行き先</span><div id="inlineTargets" class="targetgrid"></div><span class="picklabel">結果</span><div id="inlineResults" class="resultbuttons"><button data-result="●">●</button><button data-result="×">×</button><button data-result="">○</button></div></div><button id="close">閉じる</button></section><input id="file" type="file" accept="application/json,.json" hidden></main><script>
const key='feign-board-v3',oldKey='feign-board-v2';const colors=['#f2f2f2','#248c37','#f68c20','#5ee94c','#c20024','#76502e','#26cbd1','#747780','#ffdf48','#f58db7','#3d72d6','#78429a'];function fresh(){return colors.map((color,i)=>({id:i+1,name:`プレイヤー${i+1}`,color,role:'',status:'生存',records:{}}))}let players;try{const v=JSON.parse(localStorage.getItem(key)||localStorage.getItem(oldKey));players=Array.isArray(v)&&v.length===12?v.map(x=>({...x,status:x.status==='処刑'?'吊':(['生存','吊','襲撃'].includes(x.status)?x.status:'生存'),records:x.records||{}})):fresh()}catch{players=fresh()}let active=null,day=1,maxDay=3,recordFor=null;const $=id=>document.getElementById(id),board=$('board'),panel=$('panel');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(key,JSON.stringify(players))}function summaries(p){const lines=Object.entries(p.records||{}).filter(([d,r])=>r.target||r.result).sort((a,b)=>+a[0]-+b[0]).map(([d,r])=>{const target=players.find(x=>x.id===+r.target);const dot=target?`<span class="dot" title="${esc(target.name)}" style="background:${target.color}"></span>`:r.target==='home'?'在宅':r.target==='guest'?'来客':'―';return `${d}日目: ${dot} → ${esc(r.result||'○')}`});return lines.join('<br>')||'クリックして記録'}function render(){board.innerHTML=players.map(p=>`<article class="card ${p.status!=='生存'?'dead':''} ${p.id===active?'active':''}" draggable="true" data-id="${p.id}"><div class="top"><span class="dot" style="background:${/^#[0-9a-f]{6}$/i.test(p.color)?p.color:'#888888'}"></span><span class="name">${esc(p.name)}</span></div><div><span class="tag">${esc(p.status)}</span><span class="tag">${esc(p.role||'未CO')}</span></div><div class="summary">${summaries(p)}</div></article>`).join('');board.querySelectorAll('.quick').forEach(btn=>btn.onclick=e=>{e.stopPropagation();openQuick(+btn.dataset.quick)});board.querySelectorAll('.card').forEach(el=>{el.onclick=()=>openEdit(+el.dataset.id);el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.id);el.classList.add('dragging')};el.ondragend=()=>el.classList.remove('dragging');el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();e.stopPropagation();const from=+e.dataTransfer.getData('text/plain'),to=+el.dataset.id;if(from===to)return;const a=players.findIndex(x=>x.id===from),b=players.findIndex(x=>x.id===to);if(a<0||b<0)return;players.splice(b,0,players.splice(a,1)[0]);save();render()}})}function person(){return players.find(x=>x.id===active)}function openEdit(id){active=id;const p=person();['name','color','status'].forEach(k=>$(k).value=p[k]);setRoleUI(p.role);$('colorCode').textContent=p.color;$('editTitle').textContent=p.name+' の編集';panel.classList.add('show');loadInline();render()}['name','color','status'].forEach(k=>$(k).addEventListener('input',e=>{const p=person();if(!p)return;p[k]=e.target.value;if(k==='color')$('colorCode').textContent=p.color;save();$('editTitle').textContent=p.name+' の編集';loadInline();render()}));function setRoleUI(value){const select=$('role'),custom=$('roleCustom');const known=[...select.options].some(o=>o.value===value&&value!=='custom');select.value=known?value:'custom';custom.style.display=known?'none':'block';custom.value=known?'':value;}
$('role').addEventListener('change',e=>{const p=person();if(!p)return;const custom=e.target.value==='custom';$('roleCustom').style.display=custom?'block':'none';p.role=custom?$('roleCustom').value:e.target.value;save();render();if(custom)$('roleCustom').focus()});
$('roleCustom').addEventListener('input',e=>{const p=person();if(!p)return;p.role=e.target.value;save();render()});
function openQuick(id){recordFor=id;const p=players.find(x=>x.id===id);maxDay=Math.max(3,...Object.keys(p.records||{}).map(Number));$('quickTitle').textContent=p.name+' ・ '+day+'日目の記録';$('quickPanel').classList.add('show');loadQuick();}
function loadQuick(){const p=players.find(x=>x.id===recordFor);if(!p)return;$('quickDayLabel').textContent=day+'日目（全員共通）';const r=p.records[day]||{};$('quickTargets').innerHTML='<button class="targetpick '+(r.target==='home'?'chosen':'')+'" data-target="home">在宅</button><button class="targetpick '+(r.target==='guest'?'chosen':'')+'" data-target="guest">来客</button>'+players.map(x=>`<button class="targetpick ${String(r.target)===String(x.id)?'chosen':''}" data-target="${x.id}" title="${esc(x.name)}"><span class="dot" style="background:${x.color}"></span></button>`).join('');$('quickTargets').querySelectorAll('button').forEach(btn=>btn.onclick=()=>updateQuick('target',btn.dataset.target));$('quickResults').querySelectorAll('button').forEach(btn=>btn.classList.toggle('chosen',(r.result||'')===btn.dataset.result));}
function updateQuick(field,value){const p=players.find(x=>x.id===recordFor);if(!p)return;p.records[day]={...(p.records[day]||{}),[field]:value};save();loadQuick();render()}
$('quickResults').querySelectorAll('button').forEach(btn=>btn.onclick=()=>updateQuick('result',btn.dataset.result));function refreshGlobalDay(){maxDay=Math.max(maxDay,day);const sel=$('globalDay');sel.innerHTML=Array.from({length:maxDay},(_,i)=>`<option value="${i+1}">${i+1}日目</option>`).join('');sel.value=day;if(active!==null)loadInline();if(recordFor!==null){$('quickTitle').textContent=players.find(x=>x.id===recordFor).name+' ・ '+day+'日目の記録';loadQuick()}}$('globalDay').onchange=e=>{day=+e.target.value;refreshGlobalDay()};$('prevDay').onclick=()=>{day=Math.max(1,day-1);refreshGlobalDay()};$('nextDay').onclick=()=>{day++;refreshGlobalDay()};$('quickClose').onclick=()=>{$('quickPanel').classList.remove('show');recordFor=null};
function loadInline(){const p=person();if(!p)return;const r=p.records[day]||{};$('inlineDay').textContent=day+'日目の記録';$('inlineTargets').innerHTML='<button class="targetpick '+(r.target==='home'?'chosen':'')+'" data-target="home">在宅</button><button class="targetpick '+(r.target==='guest'?'chosen':'')+'" data-target="guest">来客</button>'+players.map(x=>`<button class="targetpick ${String(r.target)===String(x.id)?'chosen':''}" data-target="${x.id}" title="${esc(x.name)}"><span class="dot" style="background:${x.color}"></span></button>`).join('');$('inlineTargets').querySelectorAll('button').forEach(b=>b.onclick=()=>updateInline('target',b.dataset.target));$('inlineResults').querySelectorAll('button').forEach(b=>b.classList.toggle('chosen',(r.result||'')===b.dataset.result));}function updateInline(field,value){const p=person();if(!p)return;p.records[day]={...(p.records[day]||{}),[field]:value};save();loadInline();render()}$('inlineResults').querySelectorAll('button').forEach(b=>b.onclick=()=>updateInline('result',b.dataset.result));
$('close').onclick=()=>{active=null;panel.classList.remove('show');render()};$('reset').onclick=()=>{if(confirm('名前・色・並び順を残して、新しい盤面にしますか？ CO・状態・訪問記録は消えます。')){players=players.map(p=>({...p,role:'',status:'生存',records:{}}));active=null;day=1;maxDay=3;panel.classList.remove('show');$('quickPanel').classList.remove('show');save();refreshGlobalDay();render()}};$('resetAll').onclick=()=>{if(confirm('名前・色・並び順を含めて、12人全員を初期化しますか？')){players=fresh();active=null;day=1;maxDay=3;panel.classList.remove('show');$('quickPanel').classList.remove('show');save();refreshGlobalDay();render()}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(players,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='feign-board-v10.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!Array.isArray(v)||v.length!==12||!v.every(x=>typeof x.id==='number'&&typeof x.name==='string'&&typeof x.color==='string'))throw Error();players=v.map(x=>({...x,role:String(x.role||''),status:x.status==='処刑'?'吊':(['生存','吊','襲撃'].includes(x.status)?x.status:'生存'),records:x.records||{}}));active=null;panel.classList.remove('show');$('quickPanel').classList.remove('show');save();render()}catch{alert('12人分の正しい盤面データを選んでください')}e.target.value=''};refreshGlobalDay();render();
</script></body></html>
